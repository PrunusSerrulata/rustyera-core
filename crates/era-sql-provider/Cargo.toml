[package]
name = "era-sql-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
era-runtime-protocol = { path = "../era-runtime-protocol" }
era-protocol = { path = "../era-protocol" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["hooks", "limits", "serialize", "modern_sqlite"] }
sha2.workspace = true
unicode-normalization.workspace = true

# The user-authorized exception is confined to the private cursor module.
# All other modules retain a denied unsafe boundary.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
