[workspace]
members = [
    "crates/era-debug-protocol",
    "crates/era-protocol",
    "crates/era-runtime-ffi",
    "crates/era-runtime-capi",
    "crates/era-runtime-protocol",
    "crates/era-runtime-save",
    "crates/era-runtime",
    "crates/era-config",
    "crates/erabasic-ast",
    "crates/erabasic-bytecode",
    "crates/erabasic-compiler",
    "crates/erabasic-data",
    "crates/erabasic-csv",
    "crates/erabasic-hir",
    "crates/erabasic-html",
    "crates/erabasic-analyzer",
    "crates/erabasic-lexer",
    "crates/erabasic-parser",
    "crates/erabasic-repl",
    "crates/erabasic-validator",
    "crates/erabasic-vm",
    "tools/project-extractor",
    "tools/snapshot-analyzer",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
blake3 = "1.5.5"
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
minicbor = { version = "2.2.2", features = ["derive", "std"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
flate2 = "1.0.35"
zstd = "0.13.3"
regex = "1.11.1"
quick-xml = "0.38.0"
encoding_rs = "0.8.35"
rmp-serde = "1.3.1"
serde_json = "1.0.112"
toml_edit = "0.25.13"
